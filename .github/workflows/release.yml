name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary_ext: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            binary_ext: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            binary_ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            binary_ext: ""

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }} -p pulse-broker -p pulse-gateway -p pulse-admin

      - name: Build (cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target ${{ matrix.target }} -p pulse-broker -p pulse-gateway -p pulse-admin

      - name: Package
        run: |
          mkdir -p dist
          for bin in pulse-broker pulse-gateway pulse-admin; do
            cp target/${{ matrix.target }}/release/${bin}${{ matrix.binary_ext }} dist/
          done
          cp -r config/ dist/config/
          cd dist && tar czf ../pulse-${{ matrix.target }}.tar.gz *

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: pulse-${{ matrix.target }}
          path: pulse-${{ matrix.target }}.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          generate_release_notes: true
