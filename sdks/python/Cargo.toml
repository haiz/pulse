[package]
name = "pulse-py"
version = "0.1.0"
edition = "2021"

[lib]
name = "pulse_py"
crate-type = ["cdylib"]

[dependencies]
pulse-protocol = { path = "../../crates/pulse-protocol" }
pulse-sdk = { path = "../../crates/pulse-sdk" }
pyo3 = { version = "0.22", features = ["extension-module"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
rmpv = { version = "1", features = ["with-serde"] }
futures = "0.3"
