bytes = { workspace = true }
futures = "0.3"
rmpv = { version = "1", features = ["with-serde"] }
serde = { workspace = true }
rmp-serde = { workspace = true }
lru = "0.12"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
