[package]
name = "pulse-demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pulse end-to-end demo: e-commerce microservices in multiple languages"

[[bin]]
name = "pulse-demo"
path = "src/main.rs"

[dependencies]
pulse-protocol = { path = "../pulse-protocol" }
pulse-sdk = { path = "../pulse-sdk" }
pulse-broker = { path = "../pulse-broker" }
pulse-gateway = { path = "../pulse-gateway" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
futures = "0.3"
rmpv = { version = "1", features = ["with-serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
